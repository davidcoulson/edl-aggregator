name: test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly rebuild to pick up base-image security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU and buildx
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name builder
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAGS=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then TAGS+=(-t "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            TAGS+=(-t "$IMAGE:$V" -t "$IMAGE:${V%.*}")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push "${TAGS[@]}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --provenance=mode=max --sbom=true .
